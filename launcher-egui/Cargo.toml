# Spike: the launcher's shell and Home page on egui, over the same `core` as the iced
# launcher (`../launcher-rust`, built without its `iced-ui` feature). See README.md.
[package]
name = "spartanport-launcher-egui"
version = "2.6.0"
edition = "2024"
rust-version = "1.98"
publish = false

[[bin]]
name = "spartanport-launcher-egui"
path = "src/main.rs"

[dependencies]
spartanport-launcher = { path = "../launcher-rust", default-features = false }
serde_json = "1"
unicode-bidi = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
# glow, as Spotifast: a 2D launcher needs no wgpu.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36.2"
# The system's font files, mapped instead of read (`fonts.rs`).
memmap2 = "0.9"

# crmne/egui apps-0.36.2, the revision Spotifast pins: egui 0.36.2 plus right-to-left shaping
# (emilk/egui#8577, open upstream) and the busy-loop fix (emilk/egui#8398). Every egui crate from
# the same revision so they share one emath and epaint.
[patch.crates-io]
ecolor = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
eframe = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
emath = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "6ce633ba5f7f64d19ef6d204f9377da560bb546b" }
